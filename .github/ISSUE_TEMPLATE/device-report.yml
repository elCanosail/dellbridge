name: Device report
description: Report hardware behaviour for a Dell monitor
title: "device: "
labels: ["device-report"]
body:
  - type: input
    id: monitor
    attributes:
      label: Monitor model
      placeholder: Dell S2725QC
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Pro 14 (M4 Pro)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.x (build)"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Direct USB-C (single cable)
        - USB-C through a dock or hub
        - HDMI
        - DisplayPort
    validations:
      required: true
  - type: checkboxes
    id: ddc
    attributes:
      label: DDC/CI enabled in the monitor OSD
      options:
        - label: OSD > Others > DDC/CI is On
          required: true
  - type: textarea
    id: report
    attributes:
      label: m0-check report
      description: Paste ~/Desktop/dellbridge-m0-report.txt or attach it.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Sleep/wake behaviour, HDR, cable model, anything odd.
